
name: Build Debug APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate expected debug keystore
        shell: bash
        run: |
          set -euo pipefail

          echo "Project directory: $GITHUB_WORKSPACE"
          cd "$GITHUB_WORKSPACE"

          keytool -genkeypair \
            -keystore "$GITHUB_WORKSPACE/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

          test -f "$GITHUB_WORKSPACE/debug.keystore"
          echo "Debug keystore created successfully."

      - name: Verify Gradle wrapper
        run: |
          test -f ./gradlew
          chmod +x ./gradlew
          java -version
          ./gradlew --version

      - name: Build Debug APK only
        run: |
          ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Find generated APK
        shell: bash
        run: |
          set -euo pipefail

          find . -type f \
            -path '*/build/outputs/apk/*/*.apk' \
            -print

          test -n "$(find . -type f \
            -path '*/build/outputs/apk/debug/*.apk' \
            -print -quit)"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: rider-profit-debug-apk
          path: "**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
          retention-days: 7
